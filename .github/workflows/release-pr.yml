name: Start Release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'x.y.z (release/x.y.z must exist)'
        required: true
        type: string

concurrency:
  group: start-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Must run from master
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Run Start Release from master, using release_branch to select the source."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Prepare release PR
        run: bash scripts/release/start-release.sh
