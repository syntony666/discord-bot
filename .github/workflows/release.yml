name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Detect version bump
        id: version
        run: |
          version=$(node -p "require('./apps/bot/package.json').version")
          previous=$(git show 'HEAD^1:apps/bot/package.json' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [[ "$version" == "$previous" ]]; then
            echo "No version change; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$version" PREVIOUS="$previous" node --input-type=module <<'NODE'
            const parse = (v) => v.split('.').map(Number);
            const [a, b] = [process.env.VERSION, process.env.PREVIOUS].map(parse);
            for (const field of ['major', 'minor', 'patch']) {
              const i = { major: 0, minor: 1, patch: 2 }[field];
              if (a[i] < b[i]) {
                console.log(`::error::version went backwards: ${process.env.PREVIOUS} -> ${process.env.VERSION}`);
                process.exit(1);
              }
              if (a[i] > b[i]) break;
            }
          NODE
          VERSION="$version" node scripts/release/verify-release-data.js
          {
            echo "publish=true"
            echo "tag=@discord-bot/bot@$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-pipeline.yml
    with:
      lint: 'false'
      site: 'false'
      test: 'false'

  publish:
    name: Publish
    needs: [detect, package]
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@v8
        with:
          name: pkg-arm64
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: pkg-x64
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: release-meta
          path: artifacts/
      - name: Tag and publish the release
        run: bash scripts/release/publish-release.sh
        env:
          ARTIFACT_DIR: artifacts/

  deploy:
    name: Deploy
    needs: publish
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/deploy-vm.yml
