name: Deploy VM

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the entry command on the VM
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/scripts/known_hosts" \
            "$VM_USER@$VM_HOST" \
            'curl -fsSL https://sakiko.syntony666.com/install.sh | sudo bash'
